<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Noel">
    <meta name="description" content="Formulario en HTML 5">
    <meta name="keywords" content="html">
    <title>Formulario en HTML 5</title>
</head>
<body>
    <form method="get" action="#">
        <label for="nombre">
            <input type="text" name="nombre" required autofocus>
        </label>
        <br>
        <label for="email">
            <input type="email" name="email" required>
        </label>
        <br>
        <label for="URL"> Escribe a URL da túa web personal:
            <input type="url" name="URL">
        </label>
        <br>
        <label for="Data">
            <input type="date" name="Data">
        </label>
        <br>
        <label for="Hora">
            <input type="datetime" name="Hora">
        </label>
        <br>
        <label for="Idade">
            <input type="number" name="Idade" min="18" max="65">
        </label>
        <br>
        <label for="Teléfono">
            <input type="tel" name="Teléfono">
        </label>
        <br>
        <label for="Cor favorita">
            <input type="color" name="Cor favorita">
        </label>
        <br>
        <label for="Envío">
            <input type="submit" name="Envío">
        </label>
    </form>
</body>
</html>
